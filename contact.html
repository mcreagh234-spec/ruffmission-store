<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact – RuffMission™</title><meta name="description" content="Get in touch or ask about your order.">
<meta property="og:title" content="Contact – RuffMission™"><meta property="og:description" content="Get in touch or ask about your order."><meta property="og:image" content="images/ruff-1.jpg">
<link rel="icon" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="assets/styles.css"><script src="assets/store.js" defer></script><script src="assets/pixel.js"></script></head>
<body data-page="contact">
<main><div class="page"><h1>Get in touch</h1>
<p class="muted">Questions about sizing, an order, or tracking? Send us a message and we'll reply within 1 business day. You can also email <a data-email href="#"></a>.</p>
<form class="form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
<input type="hidden" name="form-name" value="contact"><p hidden><input name="bot-field"></p>
<div class="row"><input name="name" placeholder="Name" required autocomplete="name"><input name="email" type="email" placeholder="Email" required autocomplete="email"></div>
<div class="row"><input name="phone" type="tel" placeholder="Phone (optional)" autocomplete="tel"><input name="order" placeholder="Order # (optional)"></div>
<textarea name="message" rows="6" placeholder="Message" required></textarea>
<button class="btn" type="submit">Send message</button>
<div class="notice" role="status">Thanks! Your message was sent — we'll get back to you soon.</div></form></div></main></body></html>
